<!doctype html>
<html lang="ko">
<head>

<title>GNB</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  header { background: var(--surface); padding: 20px var(--space-24); display: flex; justify-content: center; }
  nav { width: 100%; max-width: var(--nav-width); height: var(--nav-height); box-sizing: border-box; display: flex; align-items: stretch; background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
  a { text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--focus); outline-offset: -4px; }
  .logo { width: 200px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--line); }
  .mark { width: var(--logo-w); height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .word { font-family: var(--font-serif); font-weight: 600; font-size: 16px; letter-spacing: 0.16em; color: var(--ink); line-height: 1; }
  .stitch { width: 132px; border-top: 1.5px dashed var(--ink-muted); }
  .menu { flex: 1; display: flex; align-items: center; justify-content: center; gap: 36px; }
  .menu a { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: var(--ink); }
  .cta { width: 180px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--ember); color: var(--on-ember); font-size: 15px; font-weight: 700; }
</style>
</head>
