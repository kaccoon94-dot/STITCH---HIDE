<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Footer</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  footer { background: var(--surface-deep); border-top: 1px solid var(--line); padding: 40px var(--space-24) var(--space-48); }
  .in { max-width: var(--content-width); margin: 0 auto; display: flex; align-items: center; gap: var(--space-56); flex-wrap: wrap; }
  .slot { width: var(--logo-w); height: 36px; flex-shrink: 0; box-sizing: border-box; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ink-faint); }
  .links { display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: var(--ink-muted); }
  .links p { margin: 0; display: flex; gap: 10px; flex-wrap: wrap; }
  .links a { color: var(--ink-soft); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .links a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .links b { font-weight: 700; }
</style>
</head>
<body>
<footer data-theme="dark">
  <div class="in">
    <div class="slot" role="img" aria-label="로고 자리">로고 160×36</div>
    <div class="links">
      <p><a href="#">이용약관</a><span aria-hidden="true">·</span><a href="#"><b>개인정보처리방침</b></a><span aria-hidden="true">·</span><a href="#">이용안내</a></p>
      <p><a href="#">배송 안내</a><span aria-hidden="true">·</span><a href="#">교환 및 반품 안내</a><span aria-hidden="true">·</span><a href="#">고객센터</a></p>
    </div>
  </div>
</footer>
</body>
</html>
