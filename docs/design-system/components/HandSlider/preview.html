<!-- @dsCard group="Inputs" height=180 subtitle="손 길이 cm" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HandSlider</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .band { background: var(--surface-raised); color: var(--ink); padding: var(--space-24) var(--space-32); display: flex; flex-direction: column; gap: 14px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  label { font-size: 16px; font-weight: 700; }
  label span { font-weight: 400; color: var(--ink-muted); }
  output { font-family: var(--font-serif); font-size: 28px; font-weight: 500; }
  input { width: 100%; height: 32px; margin: 0; accent-color: var(--fill); cursor: pointer; }
  .range { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="band" data-theme="light">
  <div class="top">
    <label for="hand">손 길이 <span>(손목 주름 ~ 가운뎃손가락 끝)</span></label>
    <output id="out" for="hand">18.5 cm</output>
  </div>
  <input id="hand" type="range" min="15" max="23" step="0.5" value="18.5">
  <div class="range"><span>15 cm</span><span>23 cm</span></div>
</div>
<script>
  var h = document.getElementById('hand'), o = document.getElementById('out');
  h.addEventListener('input', function () { o.textContent = Number(h.value).toFixed(1) + ' cm'; });
</script>
</body>
</html>
