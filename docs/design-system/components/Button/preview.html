<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Button</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .band { background: var(--surface); color: var(--ink); padding: var(--space-24) var(--space-32); display: flex; flex-direction: column; gap: var(--space-12); }
  .row { display: flex; gap: var(--space-12); align-items: center; flex-wrap: wrap; }
  .tag { font-size: 13px; color: var(--ink-muted); width: 72px; }
  .btn { height: var(--control-md); padding: 0 28px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 10px; border-radius: var(--radius-sm); font-size: 16px; font-weight: 500; text-decoration: none; border: 1px solid transparent; }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .star { background: var(--ember); color: var(--on-ember); font-weight: 700; }
  .star.halo { box-shadow: var(--shadow-ember); }
  .primary { background: var(--fill); color: var(--on-fill); font-weight: 700; }
  .secondary { color: var(--ink); border-color: var(--line-strong); }
  .text { padding: 0 4px; color: var(--ink); text-decoration: underline; text-underline-offset: 6px; }
  .star-text { font-weight: 700; text-decoration-color: var(--ember); text-decoration-thickness: 2px; }
</style>
</head>
<body>
<div class="band" data-theme="dark">
  <div class="row">
    <span class="tag">dark</span>
    <a class="btn star halo" href="#">맞춤 추천 시작하기
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
    <a class="btn primary" href="#">장바구니 담기</a>
    <a class="btn secondary" href="#">라인업 보기</a>
    <a class="btn text" href="#">다시 추천받기</a>
  </div>
</div>
<div class="band" data-theme="light">
  <div class="row">
    <span class="tag">light</span>
    <a class="btn star" href="#">추천 결과 보기
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
    <a class="btn primary" href="#">주문하기</a>
    <a class="btn secondary" href="#">상세 보기</a>
    <a class="btn text" href="#">삭제</a>
    <a class="btn text star-text" href="#">내게 맞는지 추천받기</a>
  </div>
</div>
</body>
</html>
