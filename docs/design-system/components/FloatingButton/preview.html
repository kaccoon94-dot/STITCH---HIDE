<!-- @dsCard group="Actions" height=200 subtitle="F-01 추천 · F-02 TOP" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>FloatingButton</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .band { background: var(--surface); padding: var(--space-24) var(--space-32); display: flex; justify-content: flex-end; }
  .stack { display: flex; flex-direction: column; gap: var(--space-12); }
  .fab { width: var(--float-size); height: var(--float-size); box-sizing: border-box; border-radius: var(--radius-full); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: 13px; font-weight: 700; box-shadow: var(--shadow-float); }
  .fab:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .rec { background: var(--ember); color: var(--on-ember); }
  .top { background: var(--surface-sunken); color: var(--ink); border: 1px solid var(--line-strong); font-size: 12px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="band" data-theme="dark">
  <div class="stack">
    <a class="fab rec" href="#" aria-label="맞춤 추천">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg>
      추천
    </a>
    <a class="fab top" href="#" aria-label="페이지 맨 위로">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
      TOP
    </a>
  </div>
</div>
</body>
</html>
