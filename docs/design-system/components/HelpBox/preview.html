<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HelpBox</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .band { background: var(--surface); color: var(--ink); padding: var(--space-24) var(--space-32); }
  .box { max-width: 400px; box-sizing: border-box; padding: var(--space-32); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); display: flex; flex-direction: column; gap: 16px; }
  .h { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
  p { margin: 0; font-size: 15px; line-height: 1.8; color: var(--ink-soft); }
  strong { color: var(--ink); }
  .dash { width: 24px; border-top: 1.5px solid var(--dash); }
</style>
</head>
<body>
<div class="band" data-theme="light">
  <aside class="box" aria-label="용어 설명">
    <span class="h"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>용어 설명</span>
    <p><strong>손 길이</strong>: 손목 주름부터 가운뎃손가락 끝까지<br>손을 편 상태에서 자로 측정해 주세요.</p>
    <span class="dash" aria-hidden="true"></span>
    <p>오른손으로 던지면 왼손에 끼는 글러브를,<br>왼손으로 던지면 오른손에 끼는 글러브를 선택합니다.</p>
  </aside>
</div>
</body>
</html>
