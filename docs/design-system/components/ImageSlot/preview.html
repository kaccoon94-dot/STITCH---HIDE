<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ImageSlot</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: var(--font-sans); display: flex; }
  .band { flex: 1; background: var(--surface); padding: var(--space-24); }
  .slot { height: 160px; background: var(--surface-sunken); border-radius: var(--radius-none); display: flex; align-items: flex-end; padding: var(--space-16); box-sizing: border-box; font-size: 12px; line-height: 1.5; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="band" data-theme="dark"><div class="slot" role="img" aria-label="장인 작업 이미지 자리">이미지 자리 560×400 · 장인 작업 장면</div></div>
<div class="band" data-theme="light"><div class="slot" role="img" aria-label="손 길이 측정 안내 이미지 자리">손 길이 측정 안내 이미지 400×240</div></div>
</body>
</html>
