<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STITCH &amp; HIDE</title>
    <!-- 파비콘: 화면 모드에 따라 -light 파일로 바뀝니다 (data-mode-icon, src/hooks/useColorMode.js) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" data-mode-icon />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" data-mode-icon />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" data-mode-icon />
    <!-- 화면 모드(다크/화이트)와 파비콘을 그리기 전에 정해 깜빡임을 막습니다 (src/hooks/useColorMode.js) -->
    <script>
      ;(function () {
        var m = null
        try {
          m = localStorage.getItem('sh-color-mode')
        } catch (e) {}
        if (m !== 'dark' && m !== 'light') {
          m = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.setAttribute('data-mode', m)
        var links = document.querySelectorAll('link[data-mode-icon]')
        for (var i = 0; i < links.length; i++) {
          var h = links[i].getAttribute('href')
          links[i].setAttribute(
            'href',
            h.replace(/(favicon|apple-touch-icon)(?:-light)?(?=[-.][^/]*$)/, m === 'light' ? '$1-light' : '$1'),
          )
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
